<g fill="#ab7df8" opacity=".75"><rect x="752" y="360" width="8" height="16" rx="2"/></g>
<text x="743" y="404" class="m s" text-anchor="middle">⋮</text>
<rect x="648" y="414" width="190" height="32" rx="7" fill="#161b22" stroke="#ab7df8" stroke-opacity=".7"/>
<text x="658" y="434" class="t s mono">shard N-1</text>
<g fill="#ab7df8" opacity=".75"><rect x="752" y="422" width="8" height="16" rx="2"/><rect x="764" y="422" width="8" height="16" rx="2"/></g>
<text x="648" y="464" class="d xs mono">BoundedQueue · mutex + 2 condvars</text>

<path d="M838 322h28M838 368h28M838 430h28" class="w"/>
<rect x="874" y="306" width="280" height="166" rx="9" fill="none" stroke="#ab7df8" stroke-opacity=".35"/>
<rect x="868" y="300" width="280" height="166" rx="9" fill="#221a33" stroke="#ab7df8"/>
<text x="880" y="320" class="t b">worker × N</text><text x="1140" y="320" class="d xs mono" text-anchor="end">pop_batch(64)</text>
<g class="s">
<rect x="880" y="330" width="256" height="24" rx="5" fill="#161b22" stroke="#30363d"/><text x="890" y="346" class="t">1  validate: range · timestamps · order</text>
<rect x="880" y="358" width="256" height="24" rx="5" fill="#161b22" stroke="#30363d"/><text x="890" y="374" class="t">2  sequence-gap check</text><text x="1128" y="374" class="d xs mono" text-anchor="end">SensorRegistry</text>
<rect x="880" y="386" width="256" height="24" rx="5" fill="#161b22" stroke="#30363d"/><text x="890" y="402" class="t">3  trend window (least squares)</text>
<rect x="880" y="414" width="256" height="40" rx="5" fill="#161b22" stroke="#30363d"/><text x="890" y="430" class="t">4  AnomalyDetector</text><text x="1128" y="430" class="d xs mono" text-anchor="end">edge-triggered</text>
<text x="904" y="446" class="m xs">limits + hysteresis · rate · trend · fault · stale</text>
</g>
<path d="M1148 384h40" class="w"/>
<rect x="1190" y="350" width="152" height="68" rx="9" fill="#161b22" stroke="#8b949e"/>
<text x="1202" y="370" class="t b">events</text><text x="1202" y="387" class="m s">raised / cleared</text><text x="1202" y="406" class="d xs mono">LoggingEventSink</text>

<!-- observe lane -->
<path d="M1000 466 V494 H640 V516" class="wd"/>
<text x="652" y="488" class="d xs">counters + latency from every thread</text>
<rect x="434" y="520" width="250" height="112" rx="9" fill="#2b1d10" stroke="#f0883e"/>
<text x="446" y="540" class="t b">Metrics</text>
<text x="446" y="558" class="m s">relaxed atomic counters</text>
<text x="446" y="574" class="m s">wait-free LatencyHistogram</text>
<text x="446" y="590" class="m s">recv · processed · invalid · dropped</text>
<text x="446" y="620" class="d xs mono">src/metrics</text>

<path d="M684 576h28" class="w"/>
<rect x="714" y="520" width="230" height="112" rx="9" fill="#1c2129" stroke="#8b949e"/>
<text x="726" y="540" class="t b">StatusReporter</text>
<text x="726" y="558" class="m s">1 Hz status block: throughput,</text>
<text x="726" y="574" class="m s">latency p50/p95/p99, queue depth,</text>
<text x="726" y="590" class="m s">sensor states, active alarms</text>
<text x="726" y="620" class="d xs mono">app/status_reporter.cpp</text>

<path d="M972 576h-26" class="w"/>
<rect x="974" y="520" width="368" height="112" rx="9" fill="#1c2129" stroke="#8b949e"/>
<text x="986" y="540" class="t b">main thread</text><text x="1330" y="540" class="d xs mono" text-anchor="end">apps/server/main.cpp</text>
<text x="986" y="558" class="m s">sigtimedwait(SIGINT, SIGTERM): no async handlers</text>
<text x="986" y="574" class="m s">shutdown: stop listener → signal stop eventfd →</text>
<text x="986" y="590" class="m s">close conns → drain every queue → join → summary</text>
<text x="986" y="620" class="d xs mono">ServerConfig: config/server.json, unknown keys rejected</text>

<!-- ============ bottom band ============ -->
<rect x="40" y="676" width="430" height="230" rx="12" fill="#161b22" stroke="#30363d"/>
<text x="58" y="702" class="t h">Wire protocol</text><text x="452" y="702" class="m s" text-anchor="end">one JSON object per line</text>
<rect x="58" y="716" width="394" height="54" rx="7" fill="#1c2129" stroke="#30363d"/>
<text x="68" y="738" class="t xs mono">{"id":"temp-001","seq":42,"status":"ok",</text>
<text x="68" y="756" class="t xs mono"> "ts":1729500000123456,"type":"temperature","value":21.5}</text>
<g class="m s">
<text x="58" y="794">• frames capped at max_frame_bytes; framer memory bounded</text>
<text x="58" y="814">• partial reads and writes handled; MSG_NOSIGNAL</text>
<text x="58" y="834">• seq per sensor: gaps reveal loss and reconnects</text>
<text x="58" y="854">• types: temperature · pressure · motor_speed · signal_strength</text>
<text x="58" y="874">• status: ok · degraded · fault</text>
</g>

<rect x="490" y="676" width="430" height="230" rx="12" fill="#161b22" stroke="#30363d"/>
<text x="508" y="702" class="t h">Layers</text><text x="902" y="702" class="m s" text-anchor="end">dependencies point down only</text>
<rect x="508" y="716" width="394" height="34" rx="7" fill="#1c2129" stroke="#8b949e"/>
<text x="520" y="737" class="t s"><tspan font-weight="700">app</tspan>   TelemetryService · ServerConfig · StatusReporter</text>
<g class="s">
<rect x="508" y="758" width="94" height="58" rx="7" fill="#0d2235" stroke="#4493f8"/><text x="518" y="780" class="t" font-weight="700">net</text><text x="518" y="798" class="m xs">sockets, server</text>
<rect x="608" y="758" width="94" height="58" rx="7" fill="#0b2a2a" stroke="#39c5cf"/><text x="618" y="780" class="t" font-weight="700">protocol</text><text x="618" y="798" class="m xs">framer, codec</text>
<rect x="708" y="758" width="94" height="58" rx="7" fill="#221a33" stroke="#ab7df8"/><text x="718" y="780" class="t" font-weight="700">processing</text><text x="718" y="798" class="m xs">queues, rules</text>
<rect x="808" y="758" width="94" height="58" rx="7" fill="#2b1d10" stroke="#f0883e"/><text x="818" y="780" class="t" font-weight="700">metrics</text><text x="818" y="798" class="m xs">counters, hist.</text>
</g>
<rect x="508" y="824" width="394" height="34" rx="7" fill="#161b22" stroke="#8b949e"/>
<text x="520" y="845" class="t s"><tspan font-weight="700">common</tspan>   Clock · Logger · TelemetryMessage · JsonReader</text>
<text x="508" y="880" class="m s">net only moves bytes: it hands frames to a ConnectionHandler</text>
<text x="508" y="896" class="m s">and never sees telemetry types. The detector has no I/O or clock.</text>

<rect x="940" y="676" width="420" height="230" rx="12" fill="#161b22" stroke="#30363d"/>
<text x="958" y="702" class="t h">Verification</text><text x="1342" y="702" class="m s" text-anchor="end">CI on push to main and every PR</text>
<g class="s">
<rect x="958" y="716" width="384" height="40" rx="7" fill="#1c2129" stroke="#30363d"/>
<text x="970" y="741" class="t"><tspan font-weight="700">114 tests</tspan>  92 unit · 22 integration (real TCP on loopback)</text>
<g transform="translate(958,766)">
<rect width="118" height="30" rx="15" fill="#12261e" stroke="#3fb950"/><text x="59" y="20" text-anchor="middle" fill="#3fb950" font-weight="600">gcc · clang</text>
<rect x="124" width="128" height="30" rx="15" fill="#12261e" stroke="#3fb950"/><text x="188" y="20" text-anchor="middle" fill="#3fb950" font-weight="600">Debug · Release</text>
<rect x="258" width="126" height="30" rx="15" fill="#12261e" stroke="#3fb950"/><text x="321" y="20" text-anchor="middle" fill="#3fb950" font-weight="600">ASan+UBSan · TSan</text>
</g>
<text x="958" y="824" class="m">• Docker image build runs the full suite</text>
<text x="958" y="844" class="m">• benchmarks/: micro-benchmarks + loadgen</text>
<text x="958" y="864" class="m">• queue optimization: 1.8–3.3× throughput, p50 −94%</text>
<text x="958" y="884" class="m">• perf profile: JSON parsing ≈ 25–30% of CPU</text>
</g>
</svg>
